[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmask-server"
version = "0.1.0"
description = "FlowMask 分级脱敏与审计溯源服务（FastAPI 一体机）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
docx = ["python-docx>=1.1"]
pdf = ["pdfplumber>=0.11"]

[tool.setuptools.packages.find]
include = ["app*", "l2_service*", "l2_training*", "l3_service*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
